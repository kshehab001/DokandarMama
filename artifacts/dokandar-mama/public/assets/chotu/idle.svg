<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" width="100%" height="100%">
  <defs>
    <!-- Skin Tone Gradients -->
    <linearGradient id="chotuSkin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFE4C7" />
      <stop offset="60%" stop-color="#FED7AA" />
      <stop offset="100%" stop-color="#FDBA74" />
    </linearGradient>
    <linearGradient id="chotuSkinShadow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FED7AA" />
      <stop offset="100%" stop-color="#F97316" stop-opacity="0.6" />
    </linearGradient>
    
    <!-- Hair Gradients -->
    <linearGradient id="chotuHair" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3D261D" />
      <stop offset="50%" stop-color="#26160F" />
      <stop offset="100%" stop-color="#140B07" />
    </linearGradient>
    <linearGradient id="chotuHairSheen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6B4232" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#3D261D" stop-opacity="0" />
    </linearGradient>

    <!-- Cap Gradients (Dokandar Green) -->
    <linearGradient id="chotuCap" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#22C55E" />
      <stop offset="40%" stop-color="#16A34A" />
      <stop offset="100%" stop-color="#15803D" />
    </linearGradient>
    <linearGradient id="chotuVisor" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#15803D" />
      <stop offset="100%" stop-color="#14532D" />
    </linearGradient>

    <!-- Vest Gradients (Royal Blue) -->
    <linearGradient id="chotuVest" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="50%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <linearGradient id="chotuVestLapel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>

    <!-- Glowing Genie Tail Gradient -->
    <linearGradient id="genieTailGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67E8F9" stop-opacity="0.95" />
      <stop offset="40%" stop-color="#38BDF8" stop-opacity="0.9" />
      <stop offset="75%" stop-color="#0284C7" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#0369A1" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="genieCoreGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E0F2FE" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0" />
    </linearGradient>

    <!-- Drop Shadows & Filters -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- 1. Ambient Genie Magical Glow -->
  <g class="ambient-glow" opacity="0.6">
    <circle cx="100" cy="185" r="30" fill="#38BDF8" filter="url(#softGlow)" opacity="0.35" />
    <circle cx="85" cy="205" r="18" fill="#67E8F9" filter="url(#softGlow)" opacity="0.4" />
  </g>

  <!-- 2. Sinuous Glowing Genie Tail -->
  <g class="genie-tail" filter="url(#dropShadow)">
    <!-- Outer Tail Swirl -->
    <path d="M 86 160 C 76 182 64 195 50 208 C 38 220 54 235 72 228 C 96 220 114 198 116 160 Z" 
          fill="url(#genieTailGrad)" />
    <!-- Inner Core Highlight Streak -->
    <path d="M 94 162 C 84 182 74 196 62 210 C 56 216 64 222 72 218 C 88 210 104 192 106 162 Z" 
          fill="url(#genieCoreGrad)" opacity="0.75" />
    <!-- Sinuous Light Trail -->
    <path d="M 90 166 Q 78 190 62 208 T 52 222" 
          fill="none" stroke="#BAE6FD" stroke-width="2" stroke-linecap="round" stroke-dasharray="4 6" opacity="0.8" />
    <!-- Magical Sparkles -->
    <circle cx="56" cy="214" r="2.5" fill="#FFFFFF" />
    <circle cx="42" cy="198" r="2" fill="#BAE6FD" />
    <circle cx="92" cy="218" r="1.5" fill="#E0F2FE" />
    <polygon points="120,188 122,182 124,188 130,190 124,192 122,198 120,192 114,190" fill="#FDE047" opacity="0.8" />
  </g>

  <!-- 3. Torso & Clothing -->
  <g id="torso" filter="url(#dropShadow)">
    <!-- White T-Shirt Body -->
    <path d="M 72 126 L 128 126 L 120 165 C 110 167 90 167 80 165 Z" fill="#FFFFFF" />
    <!-- Soft T-Shirt Crease Shadows -->
    <path d="M 95 130 Q 100 148 96 164" stroke="#E2E8F0" stroke-width="2" fill="none" stroke-linecap="round" />
    <path d="M 85 142 Q 88 152 86 162" stroke="#E2E8F0" stroke-width="1.5" fill="none" stroke-linecap="round" />
    <path d="M 112 140 Q 110 152 112 162" stroke="#E2E8F0" stroke-width="1.5" fill="none" stroke-linecap="round" />

    <!-- Blue Vest - Left Panel -->
    <path d="M 68 126 L 88 126 L 85 165 L 64 162 C 65 148 66 136 68 126 Z" fill="url(#chotuVest)" />
    <!-- Blue Vest - Right Panel -->
    <path d="M 132 126 L 112 126 L 115 165 L 136 162 C 135 148 134 136 132 126 Z" fill="url(#chotuVest)" />
    <!-- Vest Lapels / Highlighting -->
    <path d="M 88 126 L 84 152 L 85 165 L 88 126 Z" fill="url(#chotuVestLapel)" />
    <path d="M 112 126 L 116 152 L 115 165 L 112 126 Z" fill="url(#chotuVestLapel)" />
    <!-- Vest Seam Stitching -->
    <path d="M 68 132 L 86 132 M 66 160 L 84 160" stroke="#1D4ED8" stroke-width="1" stroke-linecap="round" opacity="0.6" />
    <path d="M 132 132 L 114 132 M 134 160 L 116 160" stroke="#1D4ED8" stroke-width="1" stroke-linecap="round" opacity="0.6" />
  </g>

  <!-- 4. Arms & Hands (Idle Friendly Wave Pose) -->
  <g id="arms" filter="url(#dropShadow)">
    <!-- Left Arm: Resting casually at hip -->
    <path d="M 68 130 C 52 138 50 152 56 162 C 59 166 65 166 68 160 C 70 155 64 148 72 138 Z" fill="url(#chotuSkin)" />
    <path d="M 54 158 C 55 162 60 164 64 162" stroke="#F97316" stroke-width="1.5" fill="none" opacity="0.5" />

    <!-- Right Arm: Raised in friendly wave -->
    <path d="M 130 130 C 146 132 158 124 162 108 C 164 102 158 98 152 104 C 146 112 140 122 128 138 Z" fill="url(#chotuSkin)" />
    <!-- Waving Hand -->
    <circle cx="162" cy="102" r="9" fill="url(#chotuSkin)" />
    <!-- Cute Waving Fingers -->
    <rect x="156" y="90" width="3.5" height="7" rx="1.75" fill="url(#chotuSkin)" transform="rotate(-15 156 90)" />
    <rect x="162" y="88" width="3.5" height="8" rx="1.75" fill="url(#chotuSkin)" />
    <rect x="168" y="91" width="3.5" height="7" rx="1.75" fill="url(#chotuSkin)" transform="rotate(15 168 91)" />
    <ellipse cx="155" cy="104" rx="3" ry="4" fill="url(#chotuSkin)" transform="rotate(-30 155 104)" />
    <!-- Motion lines for wave -->
    <path d="M 174 92 Q 178 98 174 104" fill="none" stroke="#60A5FA" stroke-width="2" stroke-linecap="round" opacity="0.7" />
    <path d="M 179 88 Q 185 98 179 108" fill="none" stroke="#60A5FA" stroke-width="1.5" stroke-linecap="round" opacity="0.5" />
  </g>

  <!-- 5. Neck -->
  <path d="M 90 114 L 110 114 L 108 128 L 92 128 Z" fill="url(#chotuSkinShadow)" />
  <path d="M 92 114 L 108 114 L 106 126 L 94 126 Z" fill="url(#chotuSkin)" />

  <!-- 6. Head & Face -->
  <g id="head" filter="url(#dropShadow)">
    <!-- Back Hair Shape -->
    <path d="M 64 64 C 54 80 56 106 70 118 C 76 122 84 124 100 124 C 116 124 124 122 130 118 C 144 106 146 80 136 64 Z" fill="url(#chotuHair)" />

    <!-- Cute Ears -->
    <ellipse cx="64" cy="94" rx="7.5" ry="10" fill="url(#chotuSkin)" />
    <ellipse cx="65" cy="94" rx="4.5" ry="6" fill="#FDBA74" />
    <ellipse cx="136" cy="94" rx="7.5" ry="10" fill="url(#chotuSkin)" />
    <ellipse cx="135" cy="94" rx="4.5" ry="6" fill="#FDBA74" />

    <!-- Main Face Base -->
    <path d="M 68 84 C 68 108 82 122 100 122 C 118 122 132 108 132 84 C 132 68 118 64 100 64 C 82 64 68 68 68 84 Z" fill="url(#chotuSkin)" />
    
    <!-- Cheeks Soft Blush -->
    <ellipse cx="76" cy="102" rx="7" ry="4.5" fill="#F43F5E" opacity="0.28" />
    <ellipse cx="124" cy="102" rx="7" ry="4.5" fill="#F43F5E" opacity="0.28" />

    <!-- Front Hair Bangs (under cap) -->
    <path d="M 66 70 C 72 82 82 86 90 80 C 98 88 112 86 122 74 C 128 78 134 76 135 70 Z" fill="url(#chotuHair)" />
    <path d="M 72 72 Q 82 78 88 74" fill="none" stroke="url(#chotuHairSheen)" stroke-width="2" stroke-linecap="round" />

    <!-- 7. Cap & Visor (Dokandar Signature) -->
    <g id="cap">
      <!-- Cap Dome -->
      <path d="M 65 68 C 65 40 80 32 100 32 C 120 32 135 40 135 68 C 125 64 115 62 100 62 C 85 62 75 64 65 68 Z" fill="url(#chotuCap)" />
      <!-- Cap Panel Seam -->
      <path d="M 100 32 Q 100 48 100 62" stroke="#15803D" stroke-width="1.5" fill="none" opacity="0.7" />
      
      <!-- Dokandar Mama Mini Logo Badge on Cap -->
      <circle cx="100" cy="48" r="8" fill="#FFFFFF" opacity="0.95" />
      <polygon points="100,43 103,47 106,47 103,50 105,54 100,51 95,54 97,50 94,47 97,47" fill="#15803D" />
      
      <!-- Curved Visor Brim with 3D Depth -->
      <path d="M 58 66 C 68 60 100 58 142 66 C 146 72 138 78 100 78 C 62 78 54 72 58 66 Z" fill="url(#chotuVisor)" />
      <!-- Visor Highlight Rim -->
      <path d="M 62 67 Q 100 61 138 67" stroke="#4ADE80" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.8" />
      <!-- Visor Under-Shadow on Face -->
      <path d="M 68 74 Q 100 78 132 74 Q 100 70 68 74 Z" fill="#140B07" opacity="0.18" />
    </g>

    <!-- 8. Expressive Face Features (Idle Wink & Bright Smile) -->
    <g id="face-features">
      <!-- Left Eye: Big Sparkly Eye -->
      <ellipse cx="84" cy="92" rx="7.5" ry="9" fill="#FFFFFF" />
      <ellipse cx="84" cy="92" rx="5.5" ry="6.5" fill="#3D261D" />
      <circle cx="84" cy="92" r="4" fill="#1C120C" />
      <!-- Double Sparkle Highlights -->
      <circle cx="86" cy="89" r="2.2" fill="#FFFFFF" />
      <circle cx="82" cy="94" r="1.1" fill="#FFFFFF" />
      <!-- Left Eyebrow -->
      <path d="M 76 81 Q 84 76 92 80" fill="none" stroke="#26160F" stroke-width="2.5" stroke-linecap="round" />

      <!-- Right Eye: Charming Friendly Wink -->
      <path d="M 110 93 Q 118 86 126 93" fill="none" stroke="#26160F" stroke-width="3" stroke-linecap="round" />
      <!-- Wink Eyelash Accents -->
      <path d="M 125 91 L 128 89 M 126 94 L 129 95" stroke="#26160F" stroke-width="1.5" stroke-linecap="round" />
      <!-- Right Eyebrow (Expressively Raised) -->
      <path d="M 108 78 Q 118 73 126 79" fill="none" stroke="#26160F" stroke-width="2.5" stroke-linecap="round" />

      <!-- Cute Button Nose -->
      <ellipse cx="100" cy="97" rx="2.5" ry="1.75" fill="#F97316" opacity="0.6" />
      <path d="M 99 96 Q 100 97 101 96" stroke="#EA580C" stroke-width="1" fill="none" stroke-linecap="round" />

      <!-- Confident, Warm Smile -->
      <path d="M 90 105 Q 100 115 110 105" fill="none" stroke="#3D261D" stroke-width="2.5" stroke-linecap="round" />
      <!-- Subtle Smile Shadow & Tongue -->
      <path d="M 93 106 Q 100 114 107 106 Q 100 111 93 106 Z" fill="#F43F5E" opacity="0.75" />
    </g>
  </g>
</svg>
