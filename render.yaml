## Render Blueprint for Dokandar Mama — one-click deploy.
##
## This provisions everything in one shot via Render's "New > Blueprint"
## flow: a managed PostgreSQL database, plus a single web service that
## builds and serves BOTH the API and the frontend from one URL (the API
## server serves the built frontend directly — see SERVE_STATIC_DIR below).
## One service, one URL, no CORS or cross-origin cookie configuration
## needed. See DEPLOYMENT.md for the full walkthrough.
##
## You only need to fill in the Clerk keys (marked sync: false below) —
## Render prompts for these during blueprint setup.

databases:
  - name: dokandar-mama-db
    plan: free
    postgresMajorVersion: "16"

services:
  - type: web
    name: dokandar-mama
    runtime: node
    plan: free
    rootDir: .
    buildCommand: >
      corepack enable &&
      corepack prepare pnpm@11.17.0 --activate &&
      pnpm install --frozen-lockfile &&
      pnpm --filter @workspace/api-server... run build &&
      pnpm --filter @workspace/dokandar-mama run build &&
      pnpm --filter @workspace/db run push-force
    startCommand: node artifacts/api-server/dist/index.mjs
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      # Tells the API server to also serve the built frontend from this
      # same process/URL — this is what makes it a single one-click service.
      - key: SERVE_STATIC_DIR
        value: artifacts/dokandar-mama/dist/public
      - key: DATABASE_URL
        fromDatabase:
          name: dokandar-mama-db
          property: connectionString
      - key: CLERK_SECRET_KEY
        sync: false
      - key: CLERK_PUBLISHABLE_KEY
        sync: false
      # Build-time key baked into the frontend bundle by Vite. Must be set
      # for the frontend build step above to produce a working sign-in page.
      - key: VITE_CLERK_PUBLISHABLE_KEY
        sync: false
      # Not required for the single-service setup above (same-origin calls
      # need no CORS entry). Only fill this in if you later split the
      # frontend out to a separate host/domain.
      - key: CORS_ALLOWED_ORIGINS
        sync: false
