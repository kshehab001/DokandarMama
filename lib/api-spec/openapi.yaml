openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Dokandar Mama shop assistant API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: products
    description: Inventory management
  - name: customers
    description: Customer and baki (credit) ledger
  - name: sales
    description: Billing and sales
  - name: reports
    description: Sales reports, dashboard, and restock suggestions
  - name: shops
    description: Shops, branches and team roles
  - name: organization
    description: Chain / super shop organization
  - name: master-products
    description: Global barcode product catalogue
  - name: cashbox
    description: Cash drawer sessions, expenses and reconciliation
  - name: purchases
    description: Purchase invoice OCR and stock updates
  - name: subscription
    description: Subscription plans
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /products:
    get:
      operationId: listProducts
      tags: [products]
      summary: List products
      parameters:
        - name: search
          in: query
          schema: { type: string }
        - name: lowStockOnly
          in: query
          schema: { type: boolean }
      responses:
        "200":
          description: List of products
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Product" }
    post:
      operationId: createProduct
      tags: [products]
      summary: Create a product
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProductInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Product" }

  /products/barcode/{code}:
    get:
      operationId: getProductByBarcode
      tags: [products]
      summary: Look up a product by barcode
      parameters:
        - name: code
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Found product
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Product" }
        "404":
          description: Not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /products/{id}:
    get:
      operationId: getProduct
      tags: [products]
      summary: Get a product
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Product
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Product" }
    patch:
      operationId: updateProduct
      tags: [products]
      summary: Update a product
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProductUpdate" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Product" }
    delete:
      operationId: deleteProduct
      tags: [products]
      summary: Delete a product
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204":
          description: Deleted

  /customers:
    get:
      operationId: listCustomers
      tags: [customers]
      summary: List customers
      parameters:
        - name: search
          in: query
          schema: { type: string }
        - name: withDueOnly
          in: query
          schema: { type: boolean }
      responses:
        "200":
          description: List of customers
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Customer" }
    post:
      operationId: createCustomer
      tags: [customers]
      summary: Create a customer
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CustomerInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Customer" }

  /customers/{id}:
    get:
      operationId: getCustomer
      tags: [customers]
      summary: Get a customer
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Customer
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Customer" }
    patch:
      operationId: updateCustomer
      tags: [customers]
      summary: Update a customer
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CustomerUpdate" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Customer" }
    delete:
      operationId: deleteCustomer
      tags: [customers]
      summary: Delete a customer
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204":
          description: Deleted

  /customers/{id}/ledger:
    get:
      operationId: getCustomerLedger
      tags: [customers]
      summary: Get a customer's baki ledger entries
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Ledger entries
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/LedgerEntry" }

  /customers/{id}/payments:
    post:
      operationId: recordCustomerPayment
      tags: [customers]
      summary: Record a baki payment from a customer
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PaymentInput" }
      responses:
        "201":
          description: Payment recorded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Customer" }

  /sales:
    get:
      operationId: listSales
      tags: [sales]
      summary: List sales
      parameters:
        - name: from
          in: query
          schema: { type: string }
        - name: to
          in: query
          schema: { type: string }
        - name: customerId
          in: query
          schema: { type: integer }
      responses:
        "200":
          description: List of sales
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Sale" }
    post:
      operationId: createSale
      tags: [sales]
      summary: Create a sale (bill), deducting stock and updating baki if due
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SaleInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Sale" }

  /sales/{id}:
    get:
      operationId: getSale
      tags: [sales]
      summary: Get a sale (receipt detail)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Sale
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Sale" }

  /dashboard/overview:
    get:
      operationId: getDashboardOverview
      tags: [reports]
      summary: Today's key numbers for the home dashboard
      responses:
        "200":
          description: Dashboard overview
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DashboardOverview" }

  /reports/summary:
    get:
      operationId: getSalesSummary
      tags: [reports]
      summary: Sales and profit summary for a time range
      parameters:
        - name: range
          in: query
          required: true
          schema: { type: string, enum: [today, week, month] }
      responses:
        "200":
          description: Sales summary
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SalesSummary" }

  /reports/top-products:
    get:
      operationId: getTopProducts
      tags: [reports]
      summary: Best-selling products for a time range
      parameters:
        - name: range
          in: query
          required: true
          schema: { type: string, enum: [today, week, month] }
      responses:
        "200":
          description: Top products
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/TopProduct" }

  /suggestions/restock:
    get:
      operationId: getRestockSuggestions
      tags: [reports]
      summary: Products worth restocking based on stock level and recent sales velocity
      responses:
        "200":
          description: Restock suggestions
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/RestockSuggestion" }

  /shops:
    get:
      operationId: listShops
      tags: [shops]
      summary: Shops the signed-in user belongs to
      responses:
        "200":
          description: Shops
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ShopWithRole" }
    post:
      operationId: createShop
      tags: [shops]
      summary: Create the user's shop (onboarding)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ShopInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Shop" }

  /shops/current:
    get:
      operationId: getCurrentShop
      tags: [shops]
      summary: Active shop, role and organization
      responses:
        "200":
          description: Current shop
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CurrentShop" }
    patch:
      operationId: updateCurrentShop
      tags: [shops]
      summary: Update shop settings (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ShopUpdate" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Shop" }

  /shops/branches:
    post:
      operationId: createBranch
      tags: [shops]
      summary: Add a branch to the organization (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ShopInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Shop" }

  /shops/current/members:
    get:
      operationId: listShopMembers
      tags: [shops]
      summary: Team members of the active shop
      responses:
        "200":
          description: Members
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ShopMember" }
    post:
      operationId: addShopMember
      tags: [shops]
      summary: Add or update a team member (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ShopMemberInput" }
      responses:
        "201":
          description: Saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ShopMember" }

  /shops/current/members/{id}:
    delete:
      operationId: removeShopMember
      tags: [shops]
      summary: Remove a team member (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204":
          description: Removed

  /organization:
    get:
      operationId: getOrganization
      tags: [organization]
      summary: Organization and its branches
      responses:
        "200":
          description: Organization
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrganizationInfo" }

  /organization/summary:
    get:
      operationId: getOrganizationSummary
      tags: [organization]
      summary: Sales summary per branch
      parameters:
        - name: days
          in: query
          schema: { type: integer }
      responses:
        "200":
          description: Summary
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrganizationSummary" }

  /master-products:
    get:
      operationId: searchMasterProducts
      tags: [master-products]
      summary: Search the global product catalogue
      parameters:
        - name: search
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Matches
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/MasterProduct" }

  /master-products/lookup:
    get:
      operationId: lookupMasterProduct
      tags: [master-products]
      summary: Barcode lookup in the global catalogue
      parameters:
        - name: barcode
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MasterProduct" }
        "404":
          description: Not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /cashbox/current:
    get:
      operationId: getCashboxState
      tags: [cashbox]
      summary: Current cash drawer state
      responses:
        "200":
          description: Cash box state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CashboxState" }

  /cashbox/open:
    post:
      operationId: openCashbox
      tags: [cashbox]
      summary: Open the drawer with an opening balance
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CashboxOpenInput" }
      responses:
        "201":
          description: Opened
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CashSession" }

  /cashbox/movements:
    post:
      operationId: addCashMovement
      tags: [cashbox]
      summary: Record an expense or manual cash movement
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CashMovementInput" }
      responses:
        "201":
          description: Recorded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CashMovement" }

  /cashbox/close:
    post:
      operationId: closeCashbox
      tags: [cashbox]
      summary: Close the drawer with counted cash
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CashboxCloseInput" }
      responses:
        "200":
          description: Closed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CashSession" }

  /cashbox/sessions:
    get:
      operationId: listCashSessions
      tags: [cashbox]
      summary: Cash session history
      parameters:
        - name: from
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Sessions
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CashSession" }

  /purchases:
    get:
      operationId: listPurchaseInvoices
      tags: [purchases]
      summary: Purchase invoice history
      responses:
        "200":
          description: Invoices
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PurchaseInvoiceSummary" }
    post:
      operationId: createPurchaseInvoice
      tags: [purchases]
      summary: Submit invoice OCR text for parsing and matching
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PurchaseInvoiceInput" }
      responses:
        "201":
          description: Parsed invoice
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PurchaseInvoice" }

  /purchases/{id}:
    get:
      operationId: getPurchaseInvoice
      tags: [purchases]
      summary: Get a parsed invoice
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Invoice
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PurchaseInvoice" }

  /purchases/{id}/confirm:
    post:
      operationId: confirmPurchaseInvoice
      tags: [purchases]
      summary: Confirm invoice lines and update inventory
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PurchaseConfirmInput" }
      responses:
        "200":
          description: Applied
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PurchaseConfirmResult" }

  /subscription:
    get:
      operationId: getSubscription
      tags: [subscription]
      summary: Plan catalogue and current plan
      responses:
        "200":
          description: Subscription state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SubscriptionState" }
    post:
      operationId: selectSubscriptionPlan
      tags: [subscription]
      summary: Record a plan selection (no payment yet)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SubscriptionSelectInput" }
      responses:
        "201":
          description: Selected
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SubscriptionSelection" }

  /customers/{id}/verify/send:
    post:
      operationId: sendCustomerVerification
      tags: [customers]
      summary: Send a verification code to the customer's phone
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Sent
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VerificationSendResult" }

  /customers/{id}/verify/confirm:
    post:
      operationId: confirmCustomerVerification
      tags: [customers]
      summary: Confirm the verification code
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VerificationConfirmInput" }
      responses:
        "200":
          description: Verified
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Customer" }


components:
  schemas:

    Shop:
      type: object
      required: [id, name, category, subscriptionPlan, createdAt]
      properties:
        id: { type: integer }
        organizationId: { type: ["integer", "null"] }
        name: { type: string }
        category: { type: string }
        ownerName: { type: ["string", "null"] }
        area: { type: ["string", "null"] }
        subscriptionPlan: { type: string, enum: [basic, standard, premium, organization] }
        cashboxAddon: { type: boolean }
        createdAt: { type: string }

    ShopWithRole:
      allOf:
        - $ref: "#/components/schemas/Shop"
        - type: object
          required: [role]
          properties:
            role: { type: string, enum: [admin, manager, shopkeeper] }

    ShopInput:
      type: object
      required: [name, category]
      properties:
        name: { type: string, minLength: 1 }
        category: { type: string }
        ownerName: { type: string }
        area: { type: string }
        organizationName: { type: string }

    ShopUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1 }
        category: { type: string }
        ownerName: { type: string }
        area: { type: string }
        subscriptionPlan: { type: string, enum: [basic, standard, premium, organization] }
        cashboxAddon: { type: boolean }

    CurrentShop:
      type: object
      properties:
        shop:
          oneOf:
            - $ref: "#/components/schemas/Shop"
            - type: "null"
        role: { type: ["string", "null"], enum: [admin, manager, shopkeeper, null] }
        organization:
          oneOf:
            - $ref: "#/components/schemas/OrganizationRef"
            - type: "null"

    OrganizationRef:
      type: object
      required: [id, name]
      properties:
        id: { type: integer }
        name: { type: string }

    ShopMember:
      type: object
      required: [id, userId, role]
      properties:
        id: { type: integer }
        userId: { type: string }
        name: { type: ["string", "null"] }
        role: { type: string, enum: [admin, manager, shopkeeper] }
        createdAt: { type: string }

    ShopMemberInput:
      type: object
      required: [userId, role]
      properties:
        userId: { type: string, minLength: 1 }
        name: { type: string }
        role: { type: string, enum: [admin, manager, shopkeeper] }

    OrganizationInfo:
      type: object
      required: [branches]
      properties:
        organization:
          oneOf:
            - $ref: "#/components/schemas/OrganizationRef"
            - type: "null"
        branches:
          type: array
          items:
            type: object
            required: [id, name, category, isCurrent]
            properties:
              id: { type: integer }
              name: { type: string }
              category: { type: string }
              area: { type: ["string", "null"] }
              isCurrent: { type: boolean }

    OrganizationSummary:
      type: object
      required: [days, branches, grandTotal, grandDue]
      properties:
        days: { type: integer }
        grandTotal: { type: number }
        grandDue: { type: number }
        branches:
          type: array
          items:
            type: object
            required: [shopId, name, totalSales, totalDue, transactions, staffCount]
            properties:
              shopId: { type: integer }
              name: { type: string }
              totalSales: { type: number }
              totalDue: { type: number }
              transactions: { type: integer }
              staffCount: { type: integer }

    MasterProduct:
      type: object
      required: [id, barcode, name]
      properties:
        id: { type: integer }
        barcode: { type: string }
        name: { type: string }
        nameBn: { type: ["string", "null"] }
        brand: { type: ["string", "null"] }
        category: { type: ["string", "null"] }
        unit: { type: ["string", "null"] }
        defaultPrice: { type: ["number", "null"] }
        imageUrl: { type: ["string", "null"] }

    CashSession:
      type: object
      required: [id, status, openingBalance, openedAt]
      properties:
        id: { type: integer }
        status: { type: string, enum: [open, closed] }
        openingBalance: { type: number }
        expectedClosing: { type: ["number", "null"] }
        countedClosing: { type: ["number", "null"] }
        difference: { type: ["number", "null"] }
        note: { type: ["string", "null"] }
        openedAt: { type: string }
        closedAt: { type: ["string", "null"] }

    CashMovement:
      type: object
      required: [id, type, amount, createdAt]
      properties:
        id: { type: integer }
        type: { type: string, enum: [sale, expense, cash_in, cash_out] }
        amount: { type: number }
        note: { type: ["string", "null"] }
        saleId: { type: ["integer", "null"] }
        createdAt: { type: string }

    CashboxTotals:
      type: object
      required: [cashSales, cashIn, expenses, cashOut, net]
      properties:
        cashSales: { type: number }
        cashIn: { type: number }
        expenses: { type: number }
        cashOut: { type: number }
        net: { type: number }

    CashboxState:
      type: object
      required: [movements]
      properties:
        session:
          oneOf:
            - $ref: "#/components/schemas/CashSession"
            - type: "null"
        totals:
          oneOf:
            - $ref: "#/components/schemas/CashboxTotals"
            - type: "null"
        expectedClosing: { type: ["number", "null"] }
        movements:
          type: array
          items: { $ref: "#/components/schemas/CashMovement" }

    CashboxOpenInput:
      type: object
      required: [openingBalance]
      properties:
        openingBalance: { type: number, minimum: 0 }
        note: { type: string }

    CashMovementInput:
      type: object
      required: [type, amount]
      properties:
        type: { type: string, enum: [expense, cash_in, cash_out] }
        amount: { type: number, minimum: 0 }
        note: { type: string }

