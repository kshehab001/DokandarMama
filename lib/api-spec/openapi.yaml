openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Dokandar Mama shop assistant API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: products
    description: Inventory management
  - name: customers
    description: Customer and baki (credit) ledger
  - name: sales
    description: Billing and sales
  - name: reports
    description: Sales reports, dashboard, and restock suggestions
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /products:
    get:
      operationId: listProducts
      tags: [products]
      summary: List products
      parameters:
        - name: search
          in: query
          schema: { type: string }
        - name: lowStockOnly
          in: query
          schema: { type: boolean }
      responses:
        "200":
          description: List of products
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Product" }
    post:
      operationId: createProduct
      tags: [products]
      summary: Create a product
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProductInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Product" }

  /products/barcode/{code}:
    get:
      operationId: getProductByBarcode
      tags: [products]
      summary: Look up a product by barcode
      parameters:
        - name: code
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Found product
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Product" }
        "404":
          description: Not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /products/{id}:
    get:
      operationId: getProduct
      tags: [products]
      summary: Get a product
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Product
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Product" }
    patch:
      operationId: updateProduct
      tags: [products]
      summary: Update a product
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProductUpdate" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Product" }
    delete:
      operationId: deleteProduct
      tags: [products]
      summary: Delete a product
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204":
          description: Deleted

  /customers:
    get:
      operationId: listCustomers
      tags: [customers]
      summary: List customers
      parameters:
        - name: search
          in: query
          schema: { type: string }
        - name: withDueOnly
          in: query
          schema: { type: boolean }
      responses:
        "200":
          description: List of customers
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Customer" }
    post:
      operationId: createCustomer
      tags: [customers]
      summary: Create a customer
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CustomerInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Customer" }

  /customers/{id}:
    get:
      operationId: getCustomer
      tags: [customers]
      summary: Get a customer
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Customer
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Customer" }
    patch:
      operationId: updateCustomer
      tags: [customers]
      summary: Update a customer
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CustomerUpdate" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Customer" }
    delete:
      operationId: deleteCustomer
      tags: [customers]
      summary: Delete a customer
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204":
          description: Deleted

  /customers/{id}/ledger:
    get:
      operationId: getCustomerLedger
      tags: [customers]
      summary: Get a customer's baki ledger entries
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Ledger entries
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/LedgerEntry" }

  /customers/{id}/payments:
    post:
      operationId: recordCustomerPayment
      tags: [customers]
      summary: Record a baki payment from a customer
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PaymentInput" }
      responses:
        "201":
          description: Payment recorded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Customer" }

  /sales:
    get:
      operationId: listSales
      tags: [sales]
      summary: List sales
      parameters:
        - name: from
          in: query
          schema: { type: string }
        - name: to
          in: query
          schema: { type: string }
        - name: customerId
          in: query
          schema: { type: integer }
      responses:
        "200":
          description: List of sales
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Sale" }
    post:
      operationId: createSale
      tags: [sales]
      summary: Create a sale (bill), deducting stock and updating baki if due
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SaleInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Sale" }

  /sales/{id}:
    get:
      operationId: getSale
      tags: [sales]
      summary: Get a sale (receipt detail)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Sale
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Sale" }

  /dashboard/overview:
    get:
      operationId: getDashboardOverview
      tags: [reports]
      summary: Today's key numbers for the home dashboard
      responses:
        "200":
          description: Dashboard overview
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DashboardOverview" }

  /reports/summary:
    get:
      operationId: getSalesSummary
      tags: [reports]
      summary: Sales and profit summary for a time range
      parameters:
        - name: range
          in: query
          required: true
          schema: { type: string, enum: [today, week, month] }
      responses:
        "200":
          description: Sales summary
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SalesSummary" }

  /reports/top-products:
    get:
      operationId: getTopProducts
      tags: [reports]
      summary: Best-selling products for a time range
      parameters:
        - name: range
          in: query
          required: true
          schema: { type: string, enum: [today, week, month] }
      responses:
        "200":
          description: Top products
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/TopProduct" }

  /suggestions/restock:
    get:
      operationId: getRestockSuggestions
      tags: [reports]
      summary: Products worth restocking based on stock level and recent sales velocity
      responses:
        "200":
          description: Restock suggestions
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/RestockSuggestion" }

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error: { type: string }

    Product:
      type: object
      required:
        [
          id,
          name,
          category,
          unit,
          price,
          stock,
          lowStockThreshold,
          isPriceVariable,
          updatedAt,
        ]
      properties:
        id: { type: integer }
        name: { type: string }
        barcode: { type: ["string", "null"] }
        category: { type: string }
        unit: { type: string }
        price: { type: number }
        costPrice: { type: ["number", "null"] }
        stock: { type: number }
        lowStockThreshold: { type: number }
        isPriceVariable: { type: boolean }
        updatedAt: { type: string }

    ProductInput:
      type: object
      required: [name, category, unit, price, stock]
      properties:
        name: { type: string, minLength: 1 }
        barcode: { type: string }
        category: { type: string }
        unit: { type: string }
        price: { type: number, minimum: 0 }
        costPrice: { type: number, minimum: 0 }
        stock: { type: number, minimum: 0 }
        lowStockThreshold: { type: number, minimum: 0 }
        isPriceVariable: { type: boolean }

    ProductUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1 }
        barcode: { type: string }
        category: { type: string }
        unit: { type: string }
        price: { type: number, minimum: 0 }
        costPrice: { type: number, minimum: 0 }
        stock: { type: number, minimum: 0 }
        lowStockThreshold: { type: number, minimum: 0 }
        isPriceVariable: { type: boolean }

    Customer:
      type: object
      required: [id, name, bakiBalance, createdAt]
      properties:
        id: { type: integer }
        name: { type: string }
        phone: { type: ["string", "null"] }
        bakiBalance: { type: number }
        createdAt: { type: string }

    CustomerInput:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1 }
        phone: { type: string }

    CustomerUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1 }
        phone: { type: string }

    LedgerEntry:
      type: object
      required: [id, customerId, type, amount, balanceAfter, createdAt]
      properties:
        id: { type: integer }
        customerId: { type: integer }
        type: { type: string, enum: [sale, payment] }
        amount: { type: number }
        balanceAfter: { type: number }
        note: { type: ["string", "null"] }
        createdAt: { type: string }

    PaymentInput:
      type: object
      required: [amount]
      properties:
        amount: { type: number, exclusiveMinimum: 0 }
        note: { type: string }

    SaleItemInput:
      type: object
      required: [productId, quantity, unitPrice]
      properties:
        productId: { type: integer }
        quantity: { type: number, exclusiveMinimum: 0 }
        unitPrice: { type: number, minimum: 0 }

    SaleItem:
      type: object
      required: [productId, productName, quantity, unitPrice, lineTotal]
      properties:
        productId: { type: integer }
        productName: { type: string }
        quantity: { type: number }
        unitPrice: { type: number }
        lineTotal: { type: number }

    SaleInput:
      type: object
      required: [items, paidAmount, paymentMethod]
      properties:
        customerId: { type: integer }
        customerName: { type: string }
        customerPhone: { type: string }
        items:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/SaleItemInput" }
        paidAmount: { type: number, minimum: 0 }
        paymentMethod: { type: string, enum: [cash, baki, mixed] }

    Sale:
      type: object
      required:
        [
          id,
          items,
          subtotal,
          total,
          paidAmount,
          dueAmount,
          paymentMethod,
          createdAt,
        ]
      properties:
        id: { type: integer }
        customerId: { type: ["integer", "null"] }
        customerName: { type: ["string", "null"] }
        customerPhone: { type: ["string", "null"] }
        items:
          type: array
          items: { $ref: "#/components/schemas/SaleItem" }
        subtotal: { type: number }
        total: { type: number }
        paidAmount: { type: number }
        dueAmount: { type: number }
        paymentMethod: { type: string, enum: [cash, baki, mixed] }
        createdAt: { type: string }

    DashboardOverview:
      type: object
      required:
        [
          todaySalesTotal,
          todayTransactionCount,
          totalDue,
          lowStockCount,
          customerCount,
        ]
      properties:
        todaySalesTotal: { type: number }
        todayTransactionCount: { type: integer }
        totalDue: { type: number }
        lowStockCount: { type: integer }
        customerCount: { type: integer }

    SalesSummary:
      type: object
      required:
        [
          range,
          totalSales,
          totalProfit,
          transactionCount,
          cashTotal,
          bakiTotal,
        ]
      properties:
        range: { type: string }
        totalSales: { type: number }
        totalProfit: { type: number }
        transactionCount: { type: integer }
        cashTotal: { type: number }
        bakiTotal: { type: number }

    TopProduct:
      type: object
      required: [productId, productName, quantitySold, revenue]
      properties:
        productId: { type: integer }
        productName: { type: string }
        quantitySold: { type: number }
        revenue: { type: number }

    RestockSuggestion:
      type: object
      required: [productId, productName, stock, lowStockThreshold, reason]
      properties:
        productId: { type: integer }
        productName: { type: string }
        stock: { type: number }
        lowStockThreshold: { type: number }
        avgDailySales: { type: number }
        reason: { type: string }
