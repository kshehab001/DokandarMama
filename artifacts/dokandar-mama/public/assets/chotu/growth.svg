<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" width="100%" height="100%">
  <defs>
    <linearGradient id="chotuSkin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFE4C7" />
      <stop offset="60%" stop-color="#FED7AA" />
      <stop offset="100%" stop-color="#FDBA74" />
    </linearGradient>
    <linearGradient id="chotuSkinShadow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FED7AA" />
      <stop offset="100%" stop-color="#F97316" stop-opacity="0.6" />
    </linearGradient>
    <linearGradient id="chotuHair" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3D261D" />
      <stop offset="50%" stop-color="#26160F" />
      <stop offset="100%" stop-color="#140B07" />
    </linearGradient>
    <linearGradient id="chotuCap" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#22C55E" />
      <stop offset="40%" stop-color="#16A34A" />
      <stop offset="100%" stop-color="#15803D" />
    </linearGradient>
    <linearGradient id="chotuVisor" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#15803D" />
      <stop offset="100%" stop-color="#14532D" />
    </linearGradient>
    <linearGradient id="chotuVest" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="50%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <linearGradient id="genieTailGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67E8F9" stop-opacity="0.95" />
      <stop offset="40%" stop-color="#38BDF8" stop-opacity="0.9" />
      <stop offset="75%" stop-color="#0284C7" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#0369A1" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="genieCoreGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E0F2FE" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.9" />
    </linearGradient>
    
    <!-- Growth Chart Gradient -->
    <linearGradient id="growthGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ADE80" />
      <stop offset="100%" stop-color="#16A34A" />
    </linearGradient>
    <linearGradient id="chartCard" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F8FAFC" />
    </linearGradient>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-opacity="0.15" />
    </filter>
  </defs>

  <g opacity="0.6">
    <circle cx="100" cy="185" r="30" fill="#38BDF8" filter="url(#softGlow)" opacity="0.35" />
    <circle cx="160" cy="130" r="22" fill="#22C55E" filter="url(#softGlow)" opacity="0.35" />
  </g>

  <!-- Sinuous Glowing Genie Tail -->
  <g class="genie-tail" filter="url(#dropShadow)">
    <path d="M 86 160 C 76 182 64 195 50 208 C 38 220 54 235 72 228 C 96 220 114 198 116 160 Z" fill="url(#genieTailGrad)" />
    <path d="M 94 162 C 84 182 74 196 62 210 C 56 216 64 222 72 218 C 88 210 104 192 106 162 Z" fill="url(#genieCoreGrad)" opacity="0.75" />
    <path d="M 90 166 Q 78 190 62 208 T 52 222" fill="none" stroke="#BAE6FD" stroke-width="2" stroke-linecap="round" stroke-dasharray="4 6" opacity="0.8" />
  </g>

  <!-- Torso & Clothing -->
  <g id="torso" filter="url(#dropShadow)">
    <path d="M 72 126 L 128 126 L 120 165 C 110 167 90 167 80 165 Z" fill="#FFFFFF" />
    <path d="M 68 126 L 88 126 L 85 165 L 64 162 C 65 148 66 136 68 126 Z" fill="url(#chotuVest)" />
    <path d="M 132 126 L 112 126 L 115 165 L 136 162 C 135 148 134 136 132 126 Z" fill="url(#chotuVest)" />
  </g>

  <!-- Arms: Thumbs Up & Presenting Growth Chart -->
  <g id="arms" filter="url(#dropShadow)">
    <!-- Left Hand: Thumbs Up -->
    <path d="M 68 130 C 50 134 42 122 46 110 C 50 104 56 106 58 112 C 58 120 62 128 72 136 Z" fill="url(#chotuSkin)" />
    <!-- Thumbs Up Fist & Thumb -->
    <circle cx="48" cy="112" r="6" fill="url(#chotuSkin)" />
    <rect x="44" y="98" width="5" height="12" rx="2.5" fill="url(#chotuSkin)" />

    <!-- Right Hand: Holding Upward Growth Chart Board -->
    <path d="M 130 130 C 146 132 154 144 158 156 C 160 162 152 166 146 160 C 138 152 134 142 126 136 Z" fill="url(#chotuSkin)" />
    <circle cx="152" cy="154" r="5.5" fill="url(#chotuSkin)" />

    <!-- Growth Chart Card -->
    <g transform="translate(138, 108)" filter="url(#dropShadow)">
      <rect x="0" y="0" width="38" height="34" rx="4" fill="url(#chartCard)" stroke="#CBD5E1" stroke-width="1" />
      <!-- Chart Grid Lines -->
      <line x1="6" y1="26" x2="32" y2="26" stroke="#E2E8F0" stroke-width="1" />
      <line x1="6" y1="18" x2="32" y2="18" stroke="#E2E8F0" stroke-width="1" />
      <line x1="6" y1="10" x2="32" y2="10" stroke="#E2E8F0" stroke-width="1" />
      <!-- Upward Trend Line & Gradient Area -->
      <polyline points="8,24 16,20 22,22 30,8" fill="none" stroke="url(#growthGrad)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
      <!-- Growth Arrow Point -->
      <polygon points="30,8 25,9 29,13" fill="#16A34A" />
      <!-- Data Nodes -->
      <circle cx="8" cy="24" r="1.5" fill="#16A34A" />
      <circle cx="16" cy="20" r="1.5" fill="#16A34A" />
      <circle cx="22" cy="22" r="1.5" fill="#16A34A" />
      <circle cx="30" cy="8" r="2" fill="#22C55E" />
    </g>
  </g>

  <!-- Neck -->
  <path d="M 90 114 L 110 114 L 108 128 L 92 128 Z" fill="url(#chotuSkinShadow)" />
  <path d="M 92 114 L 108 114 L 106 126 L 94 126 Z" fill="url(#chotuSkin)" />

  <!-- Head & Face -->
  <g id="head" filter="url(#dropShadow)">
    <path d="M 64 64 C 54 80 56 106 70 118 C 76 122 84 124 100 124 C 116 124 124 122 130 118 C 144 106 146 80 136 64 Z" fill="url(#chotuHair)" />
    <ellipse cx="64" cy="94" rx="7.5" ry="10" fill="url(#chotuSkin)" />
    <ellipse cx="136" cy="94" rx="7.5" ry="10" fill="url(#chotuSkin)" />
    <path d="M 68 84 C 68 108 82 122 100 122 C 118 122 132 108 132 84 C 132 68 118 64 100 64 C 82 64 68 68 68 84 Z" fill="url(#chotuSkin)" />
    <ellipse cx="76" cy="102" rx="7" ry="4.5" fill="#F43F5E" opacity="0.28" />
    <ellipse cx="124" cy="102" rx="7" ry="4.5" fill="#F43F5E" opacity="0.28" />
    <path d="M 66 70 C 72 82 82 86 90 80 C 98 88 112 86 122 74 C 128 78 134 76 135 70 Z" fill="url(#chotuHair)" />

    <!-- Cap & Visor -->
    <g id="cap">
      <path d="M 65 68 C 65 40 80 32 100 32 C 120 32 135 40 135 68 C 125 64 115 62 100 62 C 85 62 75 64 65 68 Z" fill="url(#chotuCap)" />
      <circle cx="100" cy="48" r="8" fill="#FFFFFF" opacity="0.95" />
      <polygon points="100,43 103,47 106,47 103,50 105,54 100,51 95,54 97,50 94,47 97,47" fill="#15803D" />
      <path d="M 58 66 C 68 60 100 58 142 66 C 146 72 138 78 100 78 C 62 78 54 72 58 66 Z" fill="url(#chotuVisor)" />
      <path d="M 62 67 Q 100 61 138 67" stroke="#4ADE80" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.8" />
    </g>

    <!-- Proud Wink & Big Smile -->
    <g id="face-features">
      <ellipse cx="84" cy="92" rx="7.5" ry="9" fill="#FFFFFF" />
      <ellipse cx="84" cy="92" rx="5.5" ry="6.5" fill="#3D261D" />
      <circle cx="84" cy="92" r="4" fill="#1C120C" />
      <circle cx="86" cy="89" r="2.2" fill="#FFFFFF" />
      <path d="M 76 81 Q 84 76 92 80" fill="none" stroke="#26160F" stroke-width="2.5" stroke-linecap="round" />

      <!-- Right Eye: Wink -->
      <path d="M 110 93 Q 118 86 126 93" fill="none" stroke="#26160F" stroke-width="3" stroke-linecap="round" />
      <path d="M 108 78 Q 118 73 126 79" fill="none" stroke="#26160F" stroke-width="2.5" stroke-linecap="round" />

      <!-- Nose -->
      <ellipse cx="100" cy="97" rx="2.5" ry="1.75" fill="#F97316" opacity="0.6" />

      <!-- Big Proud Smile -->
      <path d="M 90 105 Q 100 116 110 105" fill="none" stroke="#3D261D" stroke-width="2.5" stroke-linecap="round" />
      <path d="M 93 106 Q 100 115 107 106 Q 100 112 93 106 Z" fill="#F43F5E" opacity="0.75" />
    </g>
  </g>
</svg>
